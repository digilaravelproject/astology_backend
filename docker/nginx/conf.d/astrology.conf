upstream php_backend {
    server astrology-app:9000;
}

upstream reverb_backend {
    server astrology-reverb:8080;
}

upstream livekit_backend {
    server host.docker.internal:7880;
}

# 1. HTTP Server - ACME Challenge & SSL Redirect
server {
    listen 80;
    listen [::]:80;
    server_name suryapathkundli.com www.suryapathkundli.com live.suryapathkundli.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main Backend, REST API & Reverb WebSockets (suryapathkundli.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name suryapathkundli.com www.suryapathkundli.com;

    ssl_certificate /etc/letsencrypt/live/suryapathkundli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suryapathkundli.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 100M;

    # Laravel REST API & Web Routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Reverb WebSocket Proxy (/app)
    location /app {
        proxy_pass http://reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # HLS Live Video Chunks (Optimized for Free Cloudflare CDN Caching)
    location ~* \.m3u8$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.ts$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, s-maxage=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # Storage & Uploaded Files (Kundli, Photos, Audio)
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # PHP-FPM FastCGI
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# 3. LiveKit WebRTC SFU Subdomain (live.suryapathkundli.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.suryapathkundli.com;

    ssl_certificate /etc/letsencrypt/live/suryapathkundli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suryapathkundli.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://livekit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
