# Coturn Configuration for Surya Path Astrology
listening-port=3478
tls-listening-port=5349

# TLS Certificates (Valid Let's Encrypt certificates covering turn.suryapathkundli.com)
cert=/etc/letsencrypt/live/suryapathkundli.com/fullchain.pem
pkey=/etc/letsencrypt/live/suryapathkundli.com/privkey.pem

# TURN Relay Media Port Range (strictly dedicated, separated from LiveKit 50000-55000)
min-port=55001
max-port=65535

# Authentication & Credentials
use-auth-secret
static-auth-secret=livekit_secret_2024
realm=suryapathkundli.com

# Static credential fallback
user=livekit:livekit_secret_2024

fingerprint
lt-cred-mech

# Disk I/O Optimization (as specified in PDF checklist)
no-stdout-log
no-loopback-peers
no-multicast-peers

# Performance
verbose
bps-capacity=0
stale-nonce=3600
channel-lifetime=3600
permission-lifetime=3600
